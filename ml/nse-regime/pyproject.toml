[project]
name = "nse-regime"
version = "0.1.0"
description = "NSE market regime classifier: data download and audit (Nifty 200 and India VIX from Yahoo Finance)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]
